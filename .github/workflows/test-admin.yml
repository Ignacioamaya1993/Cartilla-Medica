name: Verificar administracion

on:
  push:
    paths:
      - 'api/**'
      - 'server/**'
      - 'js/admin.js'
      - 'js/review-model.js'
      - 'js/comparison-rules.js'
      - 'database/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/test-admin.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'server/**'
      - 'js/review-model.js'
      - 'js/comparison-rules.js'
      - 'database/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/test-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - run: npm test
